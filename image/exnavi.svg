<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B2400"/>
      <stop offset="100%" style="stop-color:#B23D00"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="512" cy="490" r="220" fill="none" stroke="white" stroke-width="16" opacity="0.45"/>
  <!-- Compass needle up (white) -->
  <polygon points="512,222 490,470 512,498 534,470" fill="white" opacity="0.95"/>
  <!-- Compass needle down (dim) -->
  <polygon points="512,758 490,510 512,482 534,510" fill="white" opacity="0.28"/>
  <!-- Center dot -->
  <circle cx="512" cy="490" r="30" fill="white" opacity="0.95"/>
  <circle cx="512" cy="490" r="13" fill="url(#bg)" opacity="0.85"/>
  <!-- Exnavi text -->
  <g transform="translate(512,910) skewX(-8) translate(-512,-910)">
    <text x="512" y="910"
      text-anchor="middle"
      font-family="'Impact', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="250"
      fill="white"
      opacity="0.97"
      letter-spacing="2">Exnavi</text>
  </g>
</svg>
